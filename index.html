<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vértice Clube • Área exclusiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506; --panel:#0e0e11; --panel2:#16161b; --line:#25252c; --text:#dcdce1; --muted:#8d8d98; --silver:#e3e5ea;
  --red:#ff1f2d; --green:#2ecc71; --amber:#f5b942;
  --font:"Montserrat","Helvetica Neue",Arial,sans-serif; --wide:"Michroma","Montserrat",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{color-scheme:dark;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:80}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 560px at 88% 105%,rgba(255,31,45,.22),transparent 65%),radial-gradient(600px 400px at 0 0,rgba(255,31,45,.14),transparent 70%),var(--bg)}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg path{fill:none;stroke:#ff1f2d;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-width:2}
.bg .base path{stroke-opacity:.14}
.bg .run path{stroke-dasharray:100 900;animation:run 12s linear infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 6px #ff1f2d)}
@keyframes run{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}

/* botões */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;border:0;cursor:pointer;font:700 14px/1 var(--font);letter-spacing:.04em;padding:16px 26px 16px 22px;border-radius:4px;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;box-shadow:0 12px 30px -12px rgba(255,31,45,.75);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.btn:hover{background:#ff3a47;transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{padding:10px 20px 10px 16px;font-size:12px;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.btn.ghost:hover{background:#fff;color:#050506}
.btn.dark{background:#1d1d23;box-shadow:inset 0 0 0 1px #33333b}
.btn.dark:hover{background:#2a2a32}
.btn.danger{background:#7d1018}
.btn.danger:hover{background:#c4101c}
.btn.block{width:100%}
.lnk{background:none;border:0;color:#ff6a74;cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.login{width:min(440px,100%);background:linear-gradient(180deg,rgba(22,22,27,.92),rgba(14,14,17,.92));border:1px solid #2a2a31;border-radius:8px;padding:38px 32px 30px;box-shadow:0 40px 90px -30px #000,0 0 0 1px rgba(255,31,45,.12);backdrop-filter:blur(10px);position:relative;overflow:hidden}
.login::before{content:"";position:absolute;left:0;top:0;height:2px;width:35%;background:linear-gradient(90deg,transparent,var(--red),#fff,transparent);animation:hl 4s linear infinite}
@keyframes hl{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.login .logo{height:54px;margin:0 auto 14px;filter:drop-shadow(0 0 18px rgba(255,31,45,.4))}
.login h1{margin:0;text-align:center;font:400 22px/1.2 var(--wide);letter-spacing:.3em;color:#fff}
.login h1 span{display:block;margin-top:8px;font:600 11px/1 var(--font);letter-spacing:.5em;color:var(--red)}
.login .sub{text-align:center;color:var(--muted);font-size:14px;margin:18px 0 26px}
.login .foot{margin-top:18px;text-align:center}
label{display:flex;flex-direction:column;gap:8px;font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:#b4b4be;margin-bottom:16px}
input,select,textarea{font:400 16px/1.4 var(--font);color:#fff;background:#08080a;border:1px solid #2e2e36;border-radius:4px;padding:14px;width:100%;text-transform:none;letter-spacing:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(255,31,45,.2)}
.pw{position:relative}.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:6px;bottom:6px;background:#1d1d23;border:0;border-radius:3px;padding:0 12px;cursor:pointer;font-size:12px;color:#bbb}

/* app */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(5,5,6,.78);backdrop-filter:blur(14px);border-bottom:1px solid #1d1d23}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:28px}
.brand b{font:400 15px/1 var(--wide);letter-spacing:.28em;background:linear-gradient(180deg,#fff,#a9adb5);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;margin-top:4px;font:600 9px/1 var(--font);letter-spacing:.4em;color:var(--red)}
.who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.who b{color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:16px 0 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;cursor:pointer;color:var(--muted);font:600 13px/1 var(--font);letter-spacing:.06em;padding:14px 16px;position:relative;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--red);box-shadow:0 0 12px var(--red)}
.tabs .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;margin-left:6px;padding:0 5px}
main.app{padding:28px 0 90px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h2.t{margin:0 0 6px;font:700 24px/1.2 var(--font);color:#fff}
.sub2{margin:0 0 22px;color:var(--muted);font-size:14.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;padding:22px}
.card h3{margin:0 0 12px;font:700 15px/1.3 var(--font);color:#fff;letter-spacing:.03em}
.hero{position:relative;overflow:hidden;background:radial-gradient(500px 240px at 100% 0,rgba(255,31,45,.3),transparent 70%),linear-gradient(180deg,#1a1014,var(--panel));border:1px solid rgba(255,31,45,.35);border-radius:8px;padding:30px}
.hero small{font:600 11px/1 var(--font);letter-spacing:.3em;text-transform:uppercase;color:#ff8a93}
.bal{font:400 clamp(44px,9vw,76px)/1.1 var(--wide);color:#fff;margin:10px 0 4px;text-shadow:0 0 40px rgba(255,31,45,.5)}
.bal span{font:600 14px/1 var(--font);letter-spacing:.2em;color:var(--muted);margin-left:8px}
.bar{height:8px;background:#23232a;border-radius:4px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8c0a14,var(--red));box-shadow:0 0 12px var(--red);border-radius:4px;transition:width 1s ease}
.stat b{display:block;font:400 30px/1 var(--wide);color:#fff}
.stat span{display:block;margin-top:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#08080a;border:1px dashed #44444e;border-radius:6px;padding:14px 16px;margin-top:6px}
.code b{font:400 20px/1 var(--wide);letter-spacing:.2em;color:#fff}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #1f1f25}
.item:last-child{border-bottom:0}
.item .l{min-width:0}.item .l b{display:block;color:#fff;font-weight:600;word-break:break-word}
.item .l span{font-size:13px;color:var(--muted);word-break:break-word}
.pos{color:var(--green);font-weight:700;white-space:nowrap}.neg{color:#ff6a74;font-weight:700;white-space:nowrap}
.badge{display:inline-block;font:700 10px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:3px;white-space:nowrap}
.b-pending{background:rgba(245,185,66,.14);color:var(--amber)}.b-ok{background:rgba(46,204,113,.14);color:var(--green)}.b-no{background:rgba(255,31,45,.14);color:#ff6a74}.b-gray{background:#23232a;color:#aaa}
.rw{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.rw::after{content:"";position:absolute;left:0;top:0;width:3px;height:44px;background:var(--red);box-shadow:0 0 14px var(--red)}
.rw h3{margin:0}.rw p{margin:0;color:var(--muted);font-size:14px;flex:1}
.rw .cost{font:400 22px/1 var(--wide);color:#fff}.rw .cost span{font:600 11px/1 var(--font);letter-spacing:.14em;color:var(--muted);margin-left:6px}
.empty{padding:34px 12px;text-align:center;color:var(--muted);font-size:14.5px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toolbar input{flex:1;min-width:200px}
.cl{display:grid;grid-template-columns:1.4fr 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #1f1f25}
.cl:last-child{border-bottom:0}
.cl .nm b{display:block;color:#fff}.cl .nm span{display:block;font-size:12.5px;color:var(--muted);word-break:break-all}
.cl .pt{font:400 20px/1 var(--wide);color:#fff}.cl .pt small{display:block;margin-top:6px;font:600 10px/1 var(--font);letter-spacing:.14em;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qrbox{background:#fff;border-radius:8px;padding:14px;width:min(260px,100%);margin:0 auto}
.qrbox svg{width:100%;height:auto;display:block}
.tok{font:400 12px/1.4 var(--wide);letter-spacing:.1em;text-align:center;color:#bbb;margin:12px 0 0;word-break:break-all}
#scanbox video{width:100%;max-height:320px;border-radius:6px;background:#000;object-fit:cover}
.scan{position:relative}
.scan::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--red);box-shadow:0 0 14px var(--red);animation:sc 2s ease-in-out infinite alternate}
@keyframes sc{from{top:18%}to{top:82%}}
.res{border:1px solid rgba(46,204,113,.4);background:rgba(46,204,113,.07);border-radius:6px;padding:18px;margin-top:16px}
.res.warn{border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.07)}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);animation:fade .2s ease}
.mbox{width:min(480px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1a1a20,#101013);border:1px solid #33333b;border-radius:8px;padding:26px;position:relative;box-shadow:0 40px 90px -20px #000}
.mbox h3{margin:0 0 18px;font:700 19px/1.3 var(--font);color:#fff;padding-right:30px}
.mbox .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#23232a;border:0;cursor:pointer;font-size:18px;line-height:1}
.mbox .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mbox .row .btn{flex:1;min-width:130px}
.cred{background:#08080a;border:1px dashed #44444e;border-radius:6px;padding:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;margin:0 0 14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,92vw)}
.tt{background:#17171c;border:1px solid #33333b;border-left:3px solid var(--green);color:#fff;padding:13px 16px;border-radius:5px;font-size:14px;box-shadow:0 16px 40px -10px #000;animation:fade .25s ease;width:100%}
.tt.err{border-left-color:var(--red)}

@media(max-width:860px){
  .g3,.g4{grid-template-columns:1fr 1fr}
  .cl{grid-template-columns:1fr 1fr}.cl .acts{grid-column:1/-1;justify-content:flex-start}
}
@media(max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .who .nm{display:none}
  .hero{padding:24px 20px}
  .login{padding:32px 22px 26px}
  }
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.gstep{display:flex;gap:18px;align-items:flex-start}
.gn{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--red);box-shadow:0 0 16px rgba(255,31,45,.45);display:grid;place-items:center;font:400 16px/1 var(--wide);color:#fff}
.code-pre{margin:0;max-height:300px;overflow:auto;background:#08080a;border:1px solid #2a2a31;border-radius:6px;padding:14px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfd2d8;white-space:pre;tab-size:2}
@media(max-width:560px){.gstep{flex-direction:column;gap:12px}}
</style>
</head>

<script type="text/plain" id="c-schema">-- =====================================================================
-- VÉRTICE CLUBE • Banco de dados, segurança (RLS) e regras de negócio
-- Rode este arquivo inteiro no SQL Editor do Supabase (uma única vez).
-- Nenhuma credencial fica neste arquivo.
-- =====================================================================

create extension if not exists pgcrypto;

-- ---------------------------------------------------------------- TABELAS
create table public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  role text not null default 'client' check (role in ('master','client')),
  full_name text not null check (char_length(full_name) between 3 and 120),
  cpf text not null unique check (cpf ~ '^[0-9]{11}$'),
  email text not null,
  phone text check (phone is null or char_length(phone) between 8 and 20),
  referral_code text not null unique default ('VC' || upper(encode(gen_random_bytes(4),'hex'))),
  points_balance integer not null default 0 check (points_balance >= 0),
  blocked boolean not null default false,
  created_at timestamptz not null default now()
);
-- Só pode existir UM Master.
create unique index profiles_single_master on public.profiles (role) where role = 'master';

create table public.settings (
  key text primary key,
  value integer not null check (value >= 0),
  updated_at timestamptz not null default now()
);
insert into public.settings (key, value) values ('referral_points', 100);

create table public.point_transactions (
  id bigint generated always as identity primary key,
  client_id uuid not null references public.profiles(id) on delete cascade,
  delta integer not null check (delta <> 0),
  kind text not null check (kind in ('manual','referral','redemption')),
  reason text not null,
  created_by uuid references public.profiles(id) on delete set null,
  created_at timestamptz not null default now()
);
create index point_transactions_client_idx on public.point_transactions (client_id, created_at desc);

create table public.rewards (
  id uuid primary key default gen_random_uuid(),
  title text not null check (char_length(title) between 2 and 80),
  description text check (description is null or char_length(description) <= 300),
  points_cost integer not null check (points_cost > 0),
  active boolean not null default true,
  created_at timestamptz not null default now()
);

create table public.referrals (
  id uuid primary key default gen_random_uuid(),
  referrer_id uuid not null references public.profiles(id) on delete cascade,
  referred_name text not null check (char_length(referred_name) between 2 and 100),
  referred_phone text not null check (char_length(referred_phone) between 8 and 20),
  status text not null default 'pending' check (status in ('pending','approved','rejected')),
  points_awarded integer not null default 0,
  created_at timestamptz not null default now(),
  decided_at timestamptz,
  decided_by uuid references public.profiles(id) on delete set null
);

create table public.redemptions (
  id uuid primary key default gen_random_uuid(),
  client_id uuid not null references public.profiles(id) on delete cascade,
  reward_id uuid references public.rewards(id) on delete set null,
  reward_title text not null,
  points_cost integer not null,
  token text not null unique default encode(gen_random_bytes(18),'hex'),
  status text not null default 'pending' check (status in ('pending','validated','cancelled')),
  created_at timestamptz not null default now(),
  validated_at timestamptz,
  validated_by uuid references public.profiles(id) on delete set null
);

create table public.audit_log (
  id bigint generated always as identity primary key,
  actor_id uuid references public.profiles(id) on delete set null,
  action text not null,
  target_id uuid,
  details jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now()
);

-- ------------------------------------------------------- FUNÇÕES AUXILIARES
create or replace function public.is_master() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from public.profiles where id = auth.uid() and role = 'master' and not blocked);
$$;

create or replace function public.is_active_user() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from public.profiles where id = auth.uid() and not blocked);
$$;

-- Registro de auditoria: uso interno (ninguém chama direto pelo navegador).
create or replace function public.log_audit(p_actor uuid, p_action text, p_target uuid, p_details jsonb)
returns void language sql security definer set search_path = public as $$
  insert into public.audit_log (actor_id, action, target_id, details)
  values (p_actor, p_action, p_target, coalesce(p_details, '{}'::jsonb));
$$;
revoke all on function public.log_audit(uuid, text, uuid, jsonb) from public, anon, authenticated;

-- ------------------------------------------------- SEGURANÇA (RLS + PERMISSÕES)
alter table public.profiles            enable row level security;
alter table public.settings            enable row level security;
alter table public.point_transactions  enable row level security;
alter table public.rewards             enable row level security;
alter table public.referrals           enable row level security;
alter table public.redemptions         enable row level security;
alter table public.audit_log           enable row level security;

revoke all on all tables    in schema public from anon, authenticated;
revoke all on all sequences in schema public from anon, authenticated;

-- Leitura (filtrada pelas políticas abaixo). Nenhum INSERT/UPDATE/DELETE direto,
-- exceto recompensas e configurações, que as políticas liberam só ao Master.
grant select on public.profiles, public.settings, public.point_transactions,
                public.rewards, public.referrals, public.redemptions, public.audit_log to authenticated;
grant insert, update, delete on public.rewards to authenticated;
grant update on public.settings to authenticated;

create policy profiles_select on public.profiles for select to authenticated
  using ((id = auth.uid() and not blocked) or public.is_master());

create policy settings_select on public.settings for select to authenticated
  using (public.is_active_user());
create policy settings_update on public.settings for update to authenticated
  using (public.is_master()) with check (public.is_master());

create policy tx_select on public.point_transactions for select to authenticated
  using ((client_id = auth.uid() and public.is_active_user()) or public.is_master());

create policy rewards_select on public.rewards for select to authenticated
  using (public.is_master() or (active and public.is_active_user()));
create policy rewards_insert on public.rewards for insert to authenticated
  with check (public.is_master());
create policy rewards_update on public.rewards for update to authenticated
  using (public.is_master()) with check (public.is_master());
create policy rewards_delete on public.rewards for delete to authenticated
  using (public.is_master());

create policy referrals_select on public.referrals for select to authenticated
  using ((referrer_id = auth.uid() and public.is_active_user()) or public.is_master());

create policy redemptions_select on public.redemptions for select to authenticated
  using ((client_id = auth.uid() and public.is_active_user()) or public.is_master());

create policy audit_select on public.audit_log for select to authenticated
  using (public.is_master());

-- Auditoria automática de recompensas e configurações (feitas direto pelo Master)
create or replace function public.audit_rewards() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if tg_op = 'DELETE' then
    perform public.log_audit(auth.uid(), 'reward_deleted', old.id, jsonb_build_object('title', old.title));
    return old;
  elsif tg_op = 'UPDATE' then
    perform public.log_audit(auth.uid(), 'reward_updated', new.id,
      jsonb_build_object('title', new.title, 'points_cost', new.points_cost, 'active', new.active));
    return new;
  else
    perform public.log_audit(auth.uid(), 'reward_created', new.id,
      jsonb_build_object('title', new.title, 'points_cost', new.points_cost));
    return new;
  end if;
end $$;
create trigger rewards_audit after insert or update or delete on public.rewards
  for each row execute function public.audit_rewards();

create or replace function public.audit_settings() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  new.updated_at := now();
  perform public.log_audit(auth.uid(), 'setting_updated', null,
    jsonb_build_object('key', new.key, 'old', old.value, 'new', new.value));
  return new;
end $$;
create trigger settings_audit before update on public.settings
  for each row execute function public.audit_settings();

create or replace function public.adjust_points(p_client uuid, p_delta integer, p_reason text)
returns integer language plpgsql security definer set search_path = public as $$
declare v_bal integer; v_role text; v_new integer;
begin
  if not public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  if p_delta = 0 or abs(p_delta) > 1000000 then raise exception 'Quantidade de pontos inválida'; end if;
  if p_reason is null or char_length(trim(p_reason)) < 3 then raise exception 'Informe o motivo do ajuste'; end if;
  select role, points_balance into v_role, v_bal from public.profiles where id = p_client for update;
  if not found or v_role <> 'client' then raise exception 'Cliente não encontrado'; end if;
  if v_bal + p_delta < 0 then raise exception 'Saldo insuficiente para retirar essa quantidade'; end if;
  update public.profiles set points_balance = points_balance + p_delta where id = p_client returning points_balance into v_new;
  insert into public.point_transactions (client_id, delta, kind, reason, created_by)
    values (p_client, p_delta, 'manual', trim(p_reason), auth.uid());
  perform public.log_audit(auth.uid(), case when p_delta > 0 then 'points_added' else 'points_removed' end, p_client,
    jsonb_build_object('delta', p_delta, 'reason', trim(p_reason), 'balance', v_new));
  return v_new;
end $$;

create or replace function public.set_client_blocked(p_client uuid, p_blocked boolean)
returns void language plpgsql security definer set search_path = public as $$
begin
  if not public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  update public.profiles set blocked = p_blocked where id = p_client and role = 'client';
  if not found then raise exception 'Cliente não encontrado'; end if;
  perform public.log_audit(auth.uid(), case when p_blocked then 'client_blocked' else 'client_unblocked' end, p_client, '{}'::jsonb);
end $$;

create or replace function public.approve_referral(p_id uuid)
returns integer language plpgsql security definer set search_path = public as $$
declare r public.referrals%rowtype; v_pts integer;
begin
  if not public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  select * into r from public.referrals where id = p_id and status = 'pending' for update;
  if not found then raise exception 'Indicação não encontrada ou já decidida'; end if;
  select value into v_pts from public.settings where key = 'referral_points';
  if v_pts > 0 then
    update public.profiles set points_balance = points_balance + v_pts where id = r.referrer_id;
    insert into public.point_transactions (client_id, delta, kind, reason, created_by)
      values (r.referrer_id, v_pts, 'referral', 'Indicação aprovada: ' || r.referred_name, auth.uid());
  end if;
  update public.referrals set status = 'approved', points_awarded = v_pts, decided_at = now(), decided_by = auth.uid() where id = p_id;
  perform public.log_audit(auth.uid(), 'referral_approved', r.referrer_id,
    jsonb_build_object('referral', p_id, 'name', r.referred_name, 'points', v_pts));
  return v_pts;
end $$;

create or replace function public.reject_referral(p_id uuid)
returns void language plpgsql security definer set search_path = public as $$
declare r public.referrals%rowtype;
begin
  if not public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  select * into r from public.referrals where id = p_id and status = 'pending' for update;
  if not found then raise exception 'Indicação não encontrada ou já decidida'; end if;
  update public.referrals set status = 'rejected', decided_at = now(), decided_by = auth.uid() where id = p_id;
  perform public.log_audit(auth.uid(), 'referral_rejected', r.referrer_id,
    jsonb_build_object('referral', p_id, 'name', r.referred_name));
end $$;

create or replace function public.validate_redemption(p_token text)
returns jsonb language plpgsql security definer set search_path = public as $$
declare r public.redemptions%rowtype; v_bal integer; v_blocked boolean;
begin
  if not public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  select * into r from public.redemptions where token = p_token for update;
  if not found then raise exception 'QR Code inválido'; end if;
  if r.status <> 'pending' then raise exception 'Este QR Code já foi utilizado ou cancelado'; end if;
  select points_balance, blocked into v_bal, v_blocked from public.profiles where id = r.client_id for update;
  if v_blocked then raise exception 'Cliente bloqueado'; end if;
  if v_bal < r.points_cost then raise exception 'Saldo insuficiente do cliente'; end if;
  update public.profiles set points_balance = points_balance - r.points_cost where id = r.client_id;
  insert into public.point_transactions (client_id, delta, kind, reason, created_by)
    values (r.client_id, -r.points_cost, 'redemption', 'Resgate: ' || r.reward_title, auth.uid());
  update public.redemptions set status = 'validated', validated_at = now(), validated_by = auth.uid() where id = r.id;
  perform public.log_audit(auth.uid(), 'redemption_validated', r.client_id,
    jsonb_build_object('redemption', r.id, 'reward', r.reward_title, 'points', r.points_cost));
  return jsonb_build_object('client_id', r.client_id, 'reward', r.reward_title, 'points', r.points_cost);
end $$;

-- ------------------------------------------------------ OPERAÇÕES DO CLIENTE (RPC)
create or replace function public.submit_referral(p_name text, p_phone text)
returns uuid language plpgsql security definer set search_path = public as $$
declare v_id uuid;
begin
  if not public.is_active_user() or public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  if (select count(*) from public.referrals where referrer_id = auth.uid() and status = 'pending') >= 20 then
    raise exception 'Você já tem muitas indicações aguardando aprovação';
  end if;
  insert into public.referrals (referrer_id, referred_name, referred_phone)
    values (auth.uid(), trim(p_name), trim(p_phone)) returning id into v_id;
  return v_id;
end $$;

create or replace function public.request_redemption(p_reward uuid)
returns public.redemptions language plpgsql security definer set search_path = public as $$
declare rw public.rewards%rowtype; v_bal integer; v_pending integer; r public.redemptions;
begin
  if not public.is_active_user() or public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  select * into rw from public.rewards where id = p_reward and active;
  if not found then raise exception 'Recompensa indisponível'; end if;
  select points_balance into v_bal from public.profiles where id = auth.uid();
  select coalesce(sum(points_cost), 0) into v_pending from public.redemptions where client_id = auth.uid() and status = 'pending';
  if v_bal - v_pending < rw.points_cost then raise exception 'Pontos insuficientes'; end if;
  insert into public.redemptions (client_id, reward_id, reward_title, points_cost)
    values (auth.uid(), rw.id, rw.title, rw.points_cost) returning * into r;
  return r;
end $$;

create or replace function public.cancel_redemption(p_id uuid)
returns void language plpgsql security definer set search_path = public as $$
declare r public.redemptions%rowtype;
begin
  select * into r from public.redemptions where id = p_id and status = 'pending' for update;
  if not found then raise exception 'Resgate não encontrado ou já finalizado'; end if;
  if r.client_id <> auth.uid() and not public.is_master() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  update public.redemptions set status = 'cancelled' where id = p_id;
  if public.is_master() then
    perform public.log_audit(auth.uid(), 'redemption_cancelled', r.client_id, jsonb_build_object('redemption', p_id, 'reward', r.reward_title));
  end if;
end $$;

create or replace function public.update_my_phone(p_phone text)
returns void language plpgsql security definer set search_path = public as $$
begin
  if not public.is_active_user() then raise exception 'Acesso negado' using errcode = '42501'; end if;
  update public.profiles set phone = nullif(trim(p_phone), '') where id = auth.uid();
end $$;

-- Só usuários logados executam as funções acima (visitantes nunca).

<script type="text/plain" id="c-login">// Login por CPF + senha. O navegador nunca recebe o e-mail do cliente.
// Deploy: supabase functions deploy cpf-login --no-verify-jwt
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const cors = {
  "Access-Control-Allow-Origin": Deno.env.get("ALLOWED_ORIGIN") ?? "*",
  "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
  "Access-Control-Allow-Methods": "POST, OPTIONS",
};
const json = (body: unknown, status = 200) =>
  new Response(JSON.stringify(body), { status, headers: { ...cors, "Content-Type": "application/json" } });

const GENERIC = "CPF ou senha incorretos";

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: cors });
  if (req.method !== "POST") return json({ error: "Método não permitido" }, 405);
  try {
    const { cpf, password } = await req.json();
    const digits = String(cpf ?? "").replace(/\D/g, "");
    if (digits.length !== 11 || typeof password !== "string" || password.length < 1 || password.length > 200) {
      return json({ error: GENERIC }, 401);
    }
    const url = Deno.env.get("SUPABASE_URL")!;
    const admin = createClient(url, Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!, { auth: { persistSession: false } });
    const { data: prof } = await admin.from("profiles").select("email, blocked").eq("cpf", digits).maybeSingle();
    if (!prof) return json({ error: GENERIC }, 401);

    const anon = createClient(url, Deno.env.get("SUPABASE_ANON_KEY")!, { auth: { persistSession: false } });
    const { data, error } = await anon.auth.signInWithPassword({ email: prof.email, password });
    if (error || !data.session) return json({ error: GENERIC }, 401);

    if (prof.blocked) {
      await anon.auth.signOut();
      return json({ error: "Conta bloqueada. Fale com a Vértice." }, 403);
    }
    return json({ session: { access_token: data.session.access_token, refresh_token: data.session.refresh_token } });
  } catch (_e) {
    return json({ error: "Não foi possível entrar agora. Tente novamente." }, 500);
  }
});
</script>
<script type="text/plain" id="c-admin">// Ações administrativas que exigem a chave de serviço (nunca exposta ao navegador).
// Só o Master consegue usar. Deploy: supabase functions deploy admin-api
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const cors = {
  "Access-Control-Allow-Origin": Deno.env.get("ALLOWED_ORIGIN") ?? "*",
  "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
  "Access-Control-Allow-Methods": "POST, OPTIONS",
};
const json = (body: unknown, status = 200) =>
  new Response(JSON.stringify(body), { status, headers: { ...cors, "Content-Type": "application/json" } });

function cpfValido(c: string): boolean {
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0;
    for (let i = 0; i < t; i++) s += Number(c[i]) * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== Number(c[t])) return false;
  }
  return true;
}

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: cors });
  if (req.method !== "POST") return json({ error: "Método não permitido" }, 405);
  try {
    const url = Deno.env.get("SUPABASE_URL")!;
    const authHeader = req.headers.get("Authorization") ?? "";
    const userClient = createClient(url, Deno.env.get("SUPABASE_ANON_KEY")!, {
      global: { headers: { Authorization: authHeader } }, auth: { persistSession: false },
    });
    const { data: { user } } = await userClient.auth.getUser();
    if (!user) return json({ error: "Sessão inválida" }, 401);

    const admin = createClient(url, Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!, { auth: { persistSession: false } });
    const { data: me } = await admin.from("profiles").select("role, blocked").eq("id", user.id).maybeSingle();
    if (!me || me.role !== "master" || me.blocked) return json({ error: "Acesso negado" }, 403);

    const body = await req.json();
    const action = body?.action;

    if (action === "create_client") {
      const full_name = String(body.full_name ?? "").trim();
      const cpf = String(body.cpf ?? "").replace(/\D/g, "");
      const email = String(body.email ?? "").trim().toLowerCase();
      const phone = String(body.phone ?? "").replace(/\D/g, "");
      const password = String(body.password ?? "");
      if (full_name.length < 3) return json({ error: "Informe o nome completo" }, 400);
      if (!cpfValido(cpf)) return json({ error: "CPF inválido" }, 400);
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return json({ error: "E-mail inválido" }, 400);
      if (phone.length < 10 || phone.length > 11) return json({ error: "Telefone inválido" }, 400);
      if (password.length < 8) return json({ error: "A senha inicial precisa ter ao menos 8 caracteres" }, 400);

      const { data: dup } = await admin.from("profiles").select("id").eq("cpf", cpf).maybeSingle();
      if (dup) return json({ error: "Já existe um cliente com esse CPF" }, 409);

      const { data: created, error: e1 } = await admin.auth.admin.createUser({
        email, password, email_confirm: true, user_metadata: { full_name },
      });
      if (e1 || !created.user) return json({ error: e1?.message?.includes("already") ? "Esse e-mail já está em uso" : "Não foi possível criar a conta" }, 400);

      const { data: prof, error: e2 } = await admin.from("profiles")
        .insert({ id: created.user.id, role: "client", full_name, cpf, email, phone })
        .select("id, referral_code").single();
      if (e2) {
        await admin.auth.admin.deleteUser(created.user.id);
        return json({ error: "Não foi possível criar o perfil do cliente" }, 400);
      }
      await admin.from("audit_log").insert({ actor_id: user.id, action: "client_created", target_id: prof.id, details: { name: full_name } });
      return json({ id: prof.id, referral_code: prof.referral_code });
    }

    if (action === "reset_password") {
      const client_id = String(body.client_id ?? "");
      const password = String(body.password ?? "");
      if (password.length < 8) return json({ error: "A senha precisa ter ao menos 8 caracteres" }, 400);
      const { data: target } = await admin.from("profiles").select("id, role").eq("id", client_id).maybeSingle();
      if (!target || target.role !== "client") return json({ error: "Cliente não encontrado" }, 404);
      const { error } = await admin.auth.admin.updateUserById(client_id, { password });
      if (error) return json({ error: "Não foi possível redefinir a senha" }, 400);
      await admin.from("audit_log").insert({ actor_id: user.id, action: "password_reset", target_id: client_id, details: {} });
      return json({ ok: true });
    }

    return json({ error: "Ação desconhecida" }, 400);
  } catch (_e) {
    return json({ error: "Erro interno" }, 500);
  }
});
</script>

/* ====== utilidades ====== */
var $ = function(s, r){ return (r || document).querySelector(s); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var nf = function(n){ return Number(n || 0).toLocaleString("pt-BR"); };
var fD = function(d){ return d ? new Date(d).toLocaleDateString("pt-BR") : "–"; };
var fDT = function(d){ return d ? new Date(d).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"}) : "–"; };
var dig = function(s){ return String(s || "").replace(/\D/g, ""); };
function cpfMask(v){ v = dig(v).slice(0, 11); return v.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2"); }
function phoneMask(v){ v = dig(v).slice(0, 11); if (v.length > 6) return v.replace(/(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3"); if (v.length > 2) return v.replace(/(\d{2})(\d+)/, "($1) $2"); return v; }
function cpfOk(c){ c = dig(c); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false; for (var t = 9; t < 11; t++){ var s = 0; for (var i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 !== +c[t]) return false; } return true; }
function toast(msg, err){ var el = document.createElement("div"); el.className = "tt" + (err ? " err" : ""); el.textContent = msg; $("#toast").appendChild(el); setTimeout(function(){ el.remove(); }, err ? 5200 : 3200); }
function openModal(html){ var m = $("#modal"); m.innerHTML = '<div class="mbox" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Fechar">×</button>' + html + '</div>'; m.hidden = false; var f = m.querySelector("input,select,textarea"); if (f) setTimeout(function(){ f.focus(); }, 50); }
function closeModal(){ var m = $("#modal"); m.hidden = true; m.innerHTML = ""; }
function genPw(){ var c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", o = "", a = new Uint32Array(10); crypto.getRandomValues(a); for (var i = 0; i < 10; i++) o += c[a[i] % c.length]; return o; }
function copy(t){ if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast("Copiado!"); }, function(){ toast("Não foi possível copiar", true); }); }
function msgOf(e){ return (e && e.message) ? e.message : "Algo deu errado. Tente novamente."; }

/* ====== API REAL (Supabase) ====== */
function realApi(){
  var sb = window.supabase.createClient(CFG.url, CFG.anon, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  async function q(p){ var r = await p; if (r.error) throw new Error(r.error.message); return r.data; }
  async function rpc(fn, a){ return q(sb.rpc(fn, a)); }
  async function fn(name, body, auth){
    var h = { "Content-Type": "application/json", apikey: CFG.anon };
    if (!auth && /^eyJ/.test(CFG.anon)) h.Authorization = "Bearer " + CFG.anon;
    if (auth){ var s = (await sb.auth.getSession()).data.session; if (!s) throw new Error("Sessão expirada. Entre novamente."); h.Authorization = "Bearer " + s.access_token; }

    function st(ts){ if (!t0) t0 = ts; var p = Math.min((ts - t0) / 900, 1); el.textContent = nf(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(st); }

/* ====== QR ====== */
function qrSvg(text){
  if (!window.qrcode) return '<div class="tok">' + esc(text) + '</div>';
  var q = window.qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
}
function showQR(r){
  openModal('<h3>' + esc(r.reward_title) + '</h3><div class="qrbox">' + qrSvg("VC1:" + r.token) + '</div><p class="tok">' + esc(r.token.slice(0, 8).toUpperCase()) + '…</p><p style="text-align:center;color:var(--muted);font-size:14px;margin:14px 0 0">Mostre este QR Code à Vértice. ' + nf(r.points_cost) + ' pontos serão descontados na validação.</p><div class="row" style="margin-top:16px"><button class="btn dark" data-act="copy" data-v="VC1:' + esc(r.token) + '">Copiar código</button><button class="btn" data-act="close">Fechar</button></div>');
}
var scan = { stream: null, raf: 0 };
function stopScan(){ if (scan.raf) cancelAnimationFrame(scan.raf); scan.raf = 0; if (scan.stream){ scan.stream.getTracks().forEach(function(t){ t.stop(); }); scan.stream = null; } var b = $("#scanbox"); if (b) b.hidden = true; }
async function startScan(){
  try {
    if (!window.jsQR) throw new Error("Leitor de QR indisponível. Digite o código manualmente.");
    scan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    var v = $("#vid"); v.srcObject = scan.stream; await v.play(); $("#scanbox").hidden = false; loop();
  } catch (e){ stopScan(); toast(e && e.name === "NotAllowedError" ? "Permita o acesso à câmera para escanear." : msgOf(e), true); }
}
function loop(){
  if (!scan.stream) return;
  var v = $("#vid"), c = $("#cv");
  if (v && c && v.readyState === v.HAVE_ENOUGH_DATA){
    c.width = v.videoWidth; c.height = v.videoHeight; var x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(v, 0, 0);
    var im = x.getImageData(0, 0, c.width, c.height), r = window.jsQR(im.data, im.width, im.height);
    if (r && r.data){ stopScan(); lookup(r.data); return; }
  }
  scan.raf = requestAnimationFrame(loop);
}
function lookup(text){
  var t = String(text || "").trim().replace(/^VC1:/i, "");
  var r = S.d.reds.filter(function(x){ return x.token === t || x.token.slice(0, 8).toUpperCase() === t.toUpperCase(); })[0];
  if (!r){ S.found = null; render(); toast("QR Code inválido ou não encontrado.", true); return; }
  S.found = r; render();
}

    }

    if (k === "manual"){ lookup(f.elements["t"].value); return; }
    if (k === "cfg"){ await api.setReferralPoints(parseInt(f.elements["v"].value, 10)); toast("Configuração salva"); await refresh(); return; }
  } catch (err){ toast(msgOf(err), true); }
  finally { if (btn) btn.disabled = false; }
});

(async function(){
  if (!READY){ render(); return; }
  try { S.me = await api.me(); if (S.me) await loadData(); } catch (e){ S.me = null; }
  render();
})();
})();
